<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Income</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Income</h1>
  <nav class="pageNav">
    <a class="navLink" href="index.html">Expenses</a>
    <a class="navLink" href="budget.html">Budget</a>
    <a class="navLink" href="health.html">Health</a>
    <span class="navActive">Income</span>
  </nav>
  <div id="monthSummary" class="monthSummary"></div>
</header>

<main>
  <form id="incomeForm">
    <input type="hidden" id="editId">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div class="field">
      <label for="amount">Amount (N$)</label>
      <input type="number" id="amount" step="0.01" min="0" inputmode="decimal" required>
    </div>
    <div class="field">
      <label for="source">Source</label>
      <input type="text" id="source" placeholder="e.g. SolidWorks freelance job" required>
    </div>
    <div class="field">
      <label for="note">Note (optional)</label>
      <input type="text" id="note" placeholder="optional">
    </div>
    <div class="formActions">
      <button type="submit" id="submitBtn">Add income</button>
      <button type="button" id="cancelEditBtn" hidden>Cancel</button>
    </div>
  </form>

  <section id="history">
    <h2>History</h2>
    <div id="incomeGroups"></div>
  </section>
</main>

<footer>
  <button type="button" id="exportJsonBtn">Export JSON</button>
  <button type="button" id="exportCsvBtn">Export CSV</button>
</footer>

<script src="income.js" defer></script>
</body>
</html>
